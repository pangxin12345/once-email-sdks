name: Package registry candidates

on:
  workflow_dispatch:
  push:
    tags: ['sdk-v*']

permissions:
  contents: write
  id-token: write

jobs:
  wait-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Wait for the same commit native matrix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 180); do
            result="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sdk-ci.yml --commit "$GITHUB_SHA" --limit 1 --json status,conclusion --jq '.[0] | (.status + ":" + (.conclusion // ""))')"
            case "$result" in
              completed:success) exit 0 ;;
              completed:*) echo "Native SDK matrix failed: $result" >&2; exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for the native SDK matrix" >&2
          exit 1

  package:
    needs: wait-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '20' }
      - uses: actions/setup-python@v7
        with: { python-version: '3.13' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '8.0.x' }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', tools: composer }
      - run: chmod +x scripts/package-all.sh && scripts/package-all.sh
      - uses: actions/upload-artifact@v4
        with:
          name: registry-candidates
          path: dist/registry-candidates
          if-no-files-found: error
          retention-days: 14

  github-release:
    if: startsWith(github.ref, 'refs/tags/sdk-v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: registry-candidates
          path: release-assets
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Once Email SDKs $GITHUB_REF_NAME"

  npm-publish:
    if: startsWith(github.ref, 'refs/tags/sdk-v') && vars.ENABLE_NPM_PUBLISH == 'true'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: registry-candidates, path: release-assets }
      - uses: actions/setup-node@v7
        with: { node-version: '20', registry-url: 'https://registry.npmjs.org' }
      - run: npm publish release-assets/once-email-test-*.tgz --access public --provenance

  pypi-publish:
    if: startsWith(github.ref, 'refs/tags/sdk-v') && vars.ENABLE_PYPI_PUBLISH == 'true'
    needs: package
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with: { name: registry-candidates, path: release-assets }
      - run: mkdir python-dist && cp release-assets/*.whl python-dist/ && cp release-assets/once_email_sdk-*.tar.gz python-dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: python-dist }

  nuget-publish:
    if: startsWith(github.ref, 'refs/tags/sdk-v') && vars.ENABLE_NUGET_PUBLISH == 'true'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: registry-candidates, path: release-assets }
      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '8.0.x' }
      - name: Publish to NuGet.org
        run: dotnet nuget push 'release-assets/*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  rubygems-publish:
    if: startsWith(github.ref, 'refs/tags/sdk-v') && vars.ENABLE_RUBYGEMS_PUBLISH == 'true'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: registry-candidates, path: release-assets }
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3' }
      - name: Publish to RubyGems.org
        run: gem push release-assets/*.gem
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
